<style>
  :root{
    --paper:#F3EFE2;
    --paper-dark:#E9E2CE;
    --ink:#26301F;
    --ink-soft:#5B6552;
    --green:#3E9140;
    --green-deep:#14591A;
    --gold:#EFB929;
    --rust:#B84A24;
    --amber:#C68A22;
    --moss:#5E7C4C;
    --azul:#3B6EA5;
    --azul1:#1F4E79;
    --azul2:#3B6EA5;
    --azul3:#6C97C4;
    --azul4:#A9C4E0;
    --line:#C9BE9F;
    --white:#FBF9F2;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  header.top{
    background:var(--green-deep);
    color:var(--white);
    padding:18px 16px 16px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header.top h1{
    font-size:1.15rem;
    margin:0 0 2px;
    color:var(--white);
  }
  header.top p{
    margin:0;
    font-size:0.8rem;
    color:#C9D6BE;
  }
  nav.tabs{
    display:flex;
    background:var(--green);
    position:sticky;
    top:60px;
    z-index:19;
    overflow-x:auto;
  }
  nav.tabs button{
    flex:1;
    min-width:88px;
    background:none;
    border:none;
    color:#D9E3CC;
    padding:11px 6px;
    font-size:0.78rem;
    font-family:'Inter',sans-serif;
    font-weight:600;
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{
    color:var(--white);
    border-bottom-color:var(--gold);
    background:rgba(0,0,0,0.12);
  }
  main{
    padding:16px;
    max-width:640px;
    margin:0 auto;
    padding-bottom:60px;
  }
  .card{
    background:var(--white);
    border-left:5px solid var(--green);
    border-radius:2px;
    padding:16px;
    margin-bottom:14px;
  }
  .card.urg-rojo{border-left-color:var(--rust);}
  .card.urg-naranja{border-left-color:#D9762E;}
  .card.urg-amarillo{border-left-color:var(--amber);}
  .card.urg-verde{border-left-color:var(--moss);}
  label{
    display:block;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin:12px 0 4px;
    font-weight:600;
  }
  label.first{margin-top:0;}
  select, input[type=text], input[type=number], input[type=date], textarea{
    width:100%;
    padding:10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper-dark);
    color:var(--ink);
    font-size:0.92rem;
    font-family:'Inter',sans-serif;
  }
  textarea{min-height:60px; resize:vertical;}
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}
  .area-row{
    display:flex;
    gap:8px;
  }
  .area-row input[type=number]{flex:1.4; min-width:0;}
  .area-row select{flex:1; min-width:0;}
  .ubicacion-row{
    display:flex;
    gap:8px;
  }
  .ubicacion-row input{flex:1; min-width:0;}
  .ubicacion-row button{flex:0 0 auto; white-space:nowrap;}
  .autocomplete-wrap{position:relative;}
  .autocomplete-list{
    position:absolute;
    top:100%; left:0; right:0;
    background:var(--white);
    border:1px solid var(--line);
    border-top:none;
    max-height:220px;
    overflow-y:auto;
    z-index:30;
    box-shadow:0 6px 14px rgba(0,0,0,0.18);
  }
  .autocomplete-list div{
    padding:10px 12px;
    font-size:0.85rem;
    border-bottom:1px solid var(--paper-dark);
    cursor:pointer;
  }
  .autocomplete-list div:last-child{border-bottom:none;}
  .autocomplete-list div:active, .autocomplete-list div:hover{background:var(--paper-dark);}
  .prefill-note{
    font-size:0.72rem;
    color:#8A6A10;
    background:#FBF0D2;
    border-left:3px solid var(--gold);
    padding:6px 8px;
    margin:6px 0 0;
    border-radius:2px;
  }
  .btn-edit{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:9px 12px;
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    color:var(--green-deep);
  }
  .btn{
    display:inline-block;
    background:var(--green);
    color:var(--white);
    border:none;
    padding:12px 18px;
    border-radius:3px;
    font-weight:600;
    font-size:0.92rem;
    cursor:pointer;
    margin-top:6px;
  }
  .btn.secondary{
    background:none;
    border:1px solid var(--green);
    color:var(--green-deep);
  }
  .btn.small{padding:7px 12px; font-size:0.78rem;}
  .btn.rust{background:var(--rust);}
  .suerte-block{
    background:var(--paper);
    border:1px dashed var(--line);
    padding:12px;
    margin-top:10px;
    border-radius:3px;
    position:relative;
  }
  .suerte-block .tag{
    position:absolute;
    top:-10px;
    left:10px;
    background:var(--green-deep);
    color:var(--white);
    font-size:0.7rem;
    padding:2px 8px;
    border-radius:10px;
    font-weight:700;
  }
  .semaforo{display:flex; gap:8px; margin-top:4px;}
  .semaforo label{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:0.68rem;
    text-align:center;
    padding:8px 4px;
    border-radius:4px;
    border:2px solid transparent;
    cursor:pointer;
    background:var(--paper-dark);
    margin:0;
    font-weight:600;
  }
  .semaforo input{display:none;}
  .semaforo .dot{width:16px;height:16px;border-radius:50%;}
  .semaforo label.sel-rojo{border-color:var(--rust); background:#F6DCCB;}
  .semaforo label.sel-naranja{border-color:#D9762E; background:#F8E3CC;}
  .semaforo label.sel-amarillo{border-color:var(--amber); background:#F5E7BE;}
  .semaforo label.sel-verde{border-color:var(--moss); background:#DDEAD3;}
  .dot-rojo{background:var(--rust);}
  .dot-naranja{background:#D9762E;}
  .dot-amarillo{background:var(--amber);}
  .dot-verde{background:var(--moss);}
  .badge{
    display:inline-block;
    font-size:0.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:10px;
    color:var(--white);
  }
  .badge-rojo{background:var(--rust);}
  .badge-naranja{background:#D9762E;}
  .badge-amarillo{background:var(--amber); color:var(--ink);}
  .badge-verde{background:var(--moss);}
  .badge-azul{background:var(--azul);}
  .badge-azul1{background:var(--azul1); color:#fff;}
  .badge-azul2{background:var(--azul2); color:#fff;}
  .badge-azul3{background:var(--azul3); color:#20304A;}
  .badge-azul4{background:var(--azul4); color:#20304A;}
  label.sel-azul1{border-color:var(--azul1); background:#DCE6F0;}
  label.sel-azul2{border-color:var(--azul2); background:#E1E9F3;}
  label.sel-azul3{border-color:var(--azul3); background:#E7EEF6;}
  label.sel-azul4{border-color:var(--azul4); background:#EEF3F9;}
  .dot-azul1{background:var(--azul1);}
  .dot-azul2{background:var(--azul2);}
  .dot-azul3{background:var(--azul3);}
  .dot-azul4{background:var(--azul4);}
  .pill-off{
    display:inline-block;
    font-size:0.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:10px;
    background:#8A8368;
    color:var(--white);
  }
  .pill-ok{
    display:inline-block;
    font-size:0.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:10px;
    background:var(--moss);
    color:var(--white);
  }
  .visit-summary h3{
    margin:0 0 4px;
    font-size:1rem;
  }
  .visit-summary .meta{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:30px 10px;
    font-size:0.88rem;
  }
  .note{
    font-size:0.76rem;
    color:var(--ink-soft);
    background:var(--paper-dark);
    border-radius:3px;
    padding:10px 12px;
    margin-bottom:14px;
    line-height:1.4;
  }
  .status-bar{
    font-size:0.76rem;
    padding:8px 12px;
    border-radius:3px;
    margin-bottom:14px;
    font-weight:600;
  }
  .status-ok{background:#DDEAD3; color:var(--green-deep);}
  .status-pending{background:#F5E7BE; color:#5B4A17;}
  .checklist{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:6px;
  }
  .checklist label{
    background:var(--paper-dark);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px 12px;
    font-size:0.76rem;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .filter-row{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .filter-row select{flex:1; min-width:120px;}
  .detail-toggle{cursor:pointer; text-decoration:underline; font-size:0.8rem; color:var(--green-deep); font-weight:600;}
  .divider{border:none; border-top:1px solid var(--line); margin:10px 0;}
  .small-muted{font-size:0.74rem; color:var(--ink-soft);}
  ul.tecn-list, ul.asig-list{list-style:none; padding:0; margin:8px 0 0;}
  ul.tecn-list li, ul.asig-list li{
    background:var(--paper-dark);
    padding:8px 10px;
    border-radius:3px;
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.85rem;
  }
  .x-btn{
    background:none; border:none; color:var(--rust); font-weight:700; cursor:pointer; font-size:0.9rem;
  }
</style>
</head>

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyW-JFVrGyllwxxUDg1Kz8cHGksVAzsMkC4jYTlKrw6DpI9ttq4qMsKmK3G4uT-n9JJ/exec";
const COLA_KEY = 'agse_cola_pendiente';

async function apiGetAllConfig(){
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?tipo=config`, { cache: 'no-store' });
    const data = await res.json();
    return (data && data.ok) ? (data.config || {}) : {};
  }catch(e){ return {}; }
}
async function apiSetConfig(key, value){
  try{
    const res = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({tipo:'config', key, value}) });
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){ return false; }
}
async function apiSaveVisita(visita){
  try{
    const res = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify(visita) });
    const data = await res.json();
    return data || {ok:false};
  }catch(e){ return {ok:false}; }
}
async function apiGetVisitas(){
  try{
    const res = await fetch(APPS_SCRIPT_URL, { cache: 'no-store' });
    const data = await res.json();
    return (data && data.ok) ? data.visitas : [];
  }catch(e){ return []; }
}

/* ---- Cola local: visitas que no se pudieron enviar por falta de señal ---- */
function leerCola(){
  try{ return JSON.parse(localStorage.getItem(COLA_KEY) || '[]'); }catch(e){ return []; }
}
function guardarCola(cola){
  try{ localStorage.setItem(COLA_KEY, JSON.stringify(cola)); }catch(e){ /* si falla, seguimos igual */ }
}
function agregarACola(visita){
  const cola = leerCola();
  cola.push(visita);
  guardarCola(cola);
}
async function intentarVaciarCola(){
  let cola = leerCola();
  if(cola.length === 0) return;
  const pendientes = [];
  for(const visita of cola){
    const result = await apiSaveVisita(visita);
    if(result && result.ok){
      visita.id = result.id_visita;
      state.visitasCache[visita.id] = visita;
      state.visitasIndex.push(visita.id);
    }else{
      pendientes.push(visita);
    }
  }
  guardarCola(pendientes);
  return { enviadas: cola.length - pendientes.length, pendientes: pendientes.length };
}

    await apiSetConfig('cartera_comerciales', JSON.stringify(state.carteraComerciales));
  }
  state.tecnicoPasswords = config['tecnico_passwords'] ? JSON.parse(config['tecnico_passwords']) : {};
  state.comercialPasswords = config['comercial_passwords'] ? JSON.parse(config['comercial_passwords']) : {};
  state.jefePassword = config['jefe_password'] || '';
  state.adminPassword = config['admin_password'] || '';
  state.securityVersion = config['security_version'] || '';

  // Si la versión de seguridad cambió desde la última vez que esta pestaña estuvo activa
  // (por ejemplo, cambiaste una contraseña mientras alguien la tenía abierta), se borran
  // todos los accesos ya concedidos en esta sesión y se les vuelve a pedir la clave.
  const versionVista = sessionStorage.getItem('security_version_seen');
  if(versionVista === null){
    // Primera vez que se abre esta pestaña: no hay nada que limpiar, solo se toma nota.
    sessionStorage.setItem('security_version_seen', state.securityVersion);
  }else if(versionVista !== state.securityVersion){
    Object.keys(sessionStorage).filter(k=>k.startsWith('auth_')).forEach(k=>sessionStorage.removeItem(k));
    sessionStorage.setItem('security_version_seen', state.securityVersion);
    if(['jefe','comercial','config'].includes(ui.activeTab)) ui.activeTab = 'tecnico';
  }
}
async function saveConfig(){
  await apiSetConfig('tecnicos', JSON.stringify(state.tecnicos));
  await apiSetConfig('principal', JSON.stringify(state.principal));
  await apiSetConfig('cartera_comerciales', JSON.stringify(state.carteraComerciales));
}
async function savePasswords(){
  await apiSetConfig('tecnico_passwords', JSON.stringify(state.tecnicoPasswords));
  await apiSetConfig('comercial_passwords', JSON.stringify(state.comercialPasswords));
  await apiSetConfig('jefe_password', state.jefePassword);
  await apiSetConfig('admin_password', state.adminPassword);
  // Sube la "versión de seguridad" para que cualquier pestaña que alguien tenga abierta
  // (aunque no la cierre) pierda sus accesos ya concedidos la próxima vez que vuelva a ella.
  state.securityVersion = Date.now().toString();
  await apiSetConfig('security_version', state.securityVersion);
  sessionStorage.setItem('security_version_seen', state.securityVersion);
}

async function loadAllVisitas(){
  const visitas = await apiGetVisitas();
  state.visitasCache = {};
  state.visitasIndex = [];
  visitas.forEach(v=>{
    state.visitasCache[v.id] = v;
    state.visitasIndex.push(v.id);
  });
}
async function saveVisita(visita){
  const result = await apiSaveVisita(visita);
  if(result && result.ok){
    visita.id = result.id_visita;
    state.visitasIndex.push(visita.id);
    state.visitasCache[visita.id] = visita;
    return {ok:true, id:visita.id};
  }
  // Sin señal o el servidor no respondió: queda guardada en el celular y se reintenta sola
  agregarACola(visita);
  return {ok:false, encolada:true};
}

/* ============ UTIL ============ */
/** Pide contraseña una sola vez por sesión de navegador, para un espacio (técnico/comercial/jefe).
 *  Si no hay contraseña configurada (vacía), deja pasar sin preguntar.
 *  La contraseña de Configuración (admin) funciona como llave maestra para cualquier espacio. */
function verificarClave(tipo, nombre, claveEsperada){
  if(!nombre || !claveEsperada) return true;
  const key = 'auth_'+tipo+'_'+nombre;
  if(sessionStorage.getItem(key) === '1') return true;
  const intento = prompt('Contraseña de ' + nombre + ':');
  if(intento === claveEsperada || (tipo !== 'admin' && state.adminPassword && intento === state.adminPassword)){
    sessionStorage.setItem(key, '1');
    return true;
  }
  if(intento !== null) alert('Contraseña incorrecta.');
  return false;
}

function urgBadge(v){
  const u = URGENCIAS.find(x=>x.v===v);
  return u ? `<span class="badge badge-${v}">${u.label}</span>` : '';
}
function tiempoBadge(v){
  const t = TIEMPOS_SIGUIENTE.find(x=>x.v===v);
  return t ? `<span class="badge badge-${t.tono}">${t.label}</span>` : '';
}
function fincaKeyMatches(a,b){
  return (a||'').trim().toLowerCase() === (b||'').trim().toLowerCase();
}
function findLastMatch(cliente, finca){
  let best = null;
  Object.values(state.visitasCache).forEach(v=>{
    if(v.cliente===cliente && fincaKeyMatches(v.finca, finca)){
      if(!best || v.fecha > best.fecha) best = v;
    }
  });
  return best;
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===ui.activeTab);

  const main = document.getElementById('main');
  if(ui.activeTab==='tecnico') renderTecnico(main);

}

  const showForm = ui.tecnicoSel && ui.comercialApoyadoSel && ui.clienteSel;
  const requiereCartera = state.carteraComerciales.includes(ui.comercialApoyadoSel);

  const pendientesCount = leerCola().length;
  let html = `
  <div class="note">Esta app guarda cada visita en tu base de Google Sheets. Si no hay señal en el momento, la visita queda guardada en este celular y se envía sola apenas vuelva la conexión — no necesitas repetirla ni estar pendiente.${pendientesCount>0 ? ` <strong>Ahora mismo tienes ${pendientesCount} visita(s) esperando por enviarse.</strong>` : ''}</div>

    </select>

    ${ui.tecnicoSel ? `
    <label>Comercial al que apoya en esta visita</label>
    <select id="selComercial">
      <option value="">Selecciona comercial</option>
      ${comOptions}
    </select>
    <p class="small-muted">Puedes elegir cualquier comercial, no solo el principal.</p>
    ` : ''}

    ${ui.comercialApoyadoSel ? `
    <label>Cliente</label>
    <div class="autocomplete-wrap">
      <input type="text" id="selCliente" placeholder="Escribe el nombre del cliente para filtrar" value="${ui.clienteSel || ''}" autocomplete="off">
      <div id="clienteSugerencias" class="autocomplete-list" style="display:none;"></div>
    </div>
    <p class="small-muted" id="clienteNoEncontrado" style="display:none; color:var(--rust);">No encontré ese cliente en la base de este comercial. Verifica el nombre.</p>
    ` : ''}
  </div>
  `;

  if(showForm){
    html += renderVisitaForm();
  }

  main.innerHTML = html;

  const st = document.getElementById('selTecnico');
  if(st) st.onchange = e=>{
    const nuevoTecnico = e.target.value;
    if(!verificarClave('tec', nuevoTecnico, state.tecnicoPasswords[nuevoTecnico])){
      st.value = ui.tecnicoSel || '';
      return;
    }
    ui.tecnicoSel = nuevoTecnico;
    ui.comercialApoyadoSel = state.principal[ui.tecnicoSel] || '';
    ui.clienteSel='';
    render();
  };
  const sc = document.getElementById('selComercial');
  if(sc) sc.onchange = e=>{ ui.comercialApoyadoSel=e.target.value; ui.clienteSel=''; render(); };
  const scl = document.getElementById('selCliente');
  if(scl){
    const clientesValidos = ui.comercialApoyadoSel ? CLIENTES_POR_COMERCIAL[ui.comercialApoyadoSel] : [];
    const sugerenciasBox = document.getElementById('clienteSugerencias');

    function seleccionarCliente(val){
      ui.clienteSel = val;
      ui.llantas = null;
      ui.sigTiempoSel = '';
      document.getElementById('clienteNoEncontrado').style.display = 'none';
      render();
    }

    function mostrarSugerenciasCliente(){
      const val = scl.value.trim().toLowerCase();
      document.getElementById('clienteNoEncontrado').style.display = 'none';
      if(!val){ sugerenciasBox.style.display = 'none'; sugerenciasBox.innerHTML=''; return; }
      const matches = clientesValidos.filter(c=>c.toLowerCase().includes(val)).slice(0,40);
      if(matches.length===0){ sugerenciasBox.style.display = 'none'; sugerenciasBox.innerHTML=''; return; }
      sugerenciasBox.innerHTML = matches.map(c=>`<div>${c}</div>`).join('');
      sugerenciasBox.style.display = 'block';
      Array.from(sugerenciasBox.children).forEach((opt,i)=>{
        opt.onclick = ()=>{
          scl.value = matches[i];
          sugerenciasBox.style.display = 'none';
          seleccionarCliente(matches[i]);
        };
      });
    }

    scl.addEventListener('input', mostrarSugerenciasCliente);
    scl.addEventListener('focus', mostrarSugerenciasCliente);
    scl.addEventListener('blur', ()=>{
      setTimeout(()=>{
        sugerenciasBox.style.display = 'none';
        const val = scl.value.trim();
        if(val === ui.clienteSel) return;
        if(clientesValidos.includes(val)){
          seleccionarCliente(val);
        }else if(val === ''){
          ui.clienteSel = '';
          render();
        }else{
          document.getElementById('clienteNoEncontrado').style.display = 'block';
        }
      }, 200);
    });
  }

  if(showForm) wireVisitaForm();
}

    syncSuertesFromDOM();

  const siguienteWrap = document.getElementById('siguienteWrap');

  document.getElementById('btnAddSiguiente').onclick = ()=>{
    syncSiguienteFromDOM();
    ui.siguienteLaborList.push({});
    document.getElementById('siguienteWrap').innerHTML = renderSiguienteBlocks();
    wireSiguienteEvents();
  };

  const selCultivo = document.getElementById('selCultivo');
  selCultivo.onchange = ()=>{
    document.getElementById('cultivoOtroWrap').style.display = selCultivo.value==='Otro' ? 'block':'none';
  };

  const inpFinca = document.getElementById('inpFinca');
  const fincaSugerenciasBox = document.getElementById('fincaSugerencias');
  const fincasConocidas = [...new Set(Object.values(state.visitasCache).filter(v=>v.cliente===ui.clienteSel).map(v=>v.finca).filter(Boolean))];

  function aplicarFinca(){
    inpFinca.style.borderColor = '';
    document.getElementById('fincaRequiredMsg').style.display = 'none';
    const match = findLastMatch(ui.clienteSel, inpFinca.value);
    const fincaVisitadaMsg = document.getElementById('fincaVisitadaMsg');
    if(match){
      document.getElementById('inpUbicacion').value = match.ubicacion || '';
      document.getElementById('inpLocalidad').value = match.localidad || '';
      document.getElementById('inpAreaValor').value = match.areaValor || '';
      document.getElementById('selAreaUnidad').value = match.areaUnidad || 'ha';
      const selCultivo = document.getElementById('selCultivo');
      selCultivo.value = match.cultivo || 'Caña';
      document.getElementById('cultivoOtroWrap').style.display = match.cultivo==='Otro' ? 'block':'none';
      if(document.getElementById('inpCultivoOtro')) document.getElementById('inpCultivoOtro').value = match.cultivoOtro || '';
      document.getElementById('prefillNote').style.display = 'block';
      document.getElementById('ubicacionGuardadaMsg').style.display = match.ubicacion ? 'block':'none';
      fincaVisitadaMsg.textContent = `✓ Ya habías visitado esta finca antes (última vez: ${match.fecha || '—'}). Datos cargados de esa visita.`;
      fincaVisitadaMsg.style.display = 'block';
    }else{
      fincaVisitadaMsg.style.display = 'none';
    }
  }

  function mostrarSugerenciasFinca(){
    const val = inpFinca.value.trim().toLowerCase();
    if(!val){ fincaSugerenciasBox.style.display='none'; fincaSugerenciasBox.innerHTML=''; return; }
    const matches = fincasConocidas.filter(f=>f.toLowerCase().includes(val)).slice(0,20);
    if(matches.length===0){ fincaSugerenciasBox.style.display='none'; fincaSugerenciasBox.innerHTML=''; return; }
    fincaSugerenciasBox.innerHTML = matches.map(f=>`<div>${f}</div>`).join('');
    fincaSugerenciasBox.style.display='block';
    Array.from(fincaSugerenciasBox.children).forEach((opt,i)=>{
      opt.onclick = ()=>{
        inpFinca.value = matches[i];
        fincaSugerenciasBox.style.display = 'none';
        aplicarFinca();
      };
    });
  }

      return;

        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);

        ubicacionMsg.style.display = 'block';
        btn.textContent = '📍 Guardar';

      err=>{
        btn.textContent = '📍 Guardar';

  document.querySelectorAll('.llantas-urgencia').forEach(radio=>{

function wireSuertesEvents(){
  document.querySelectorAll('.s-labor').forEach(sel=>{
    sel.onchange = ()=>{
      const wrap = sel.closest('.suerte-block').querySelector('.s-labor-otro-wrap');
      wrap.style.display = sel.value==='Otro' ? 'block':'none';
    };
  });
  document.querySelectorAll('.s-urgencia').forEach(radio=>{
    radio.onchange = ()=>{
      const block = radio.closest('.suerte-block');
      block.querySelectorAll('.semaforo label').forEach(l=>l.className='');
      radio.closest('label').className = 'sel-'+radio.value;
    };
  });
  document.querySelectorAll('.btn-remove-suerte').forEach(btn=>{
    btn.onclick = ()=>{
      syncSuertesFromDOM();
      const idx = parseInt(btn.closest('.suerte-block').dataset.idx);
      ui.suertes.splice(idx,1);
      document.getElementById('suertesWrap').innerHTML = renderSuertesBlocks();
      wireSuertesEvents();
    };
  });
  document.querySelectorAll('.s-fotos').forEach(inp=>{
    inp.onchange = async ()=>{
      const block = inp.closest('.suerte-block');
      const idx = parseInt(block.dataset.idx);
      const statusEl = block.querySelector('.fotos-status');
      const files = Array.from(inp.files || []);
      if(files.length===0) return;
      statusEl.textContent = 'Comprimiendo fotos...';
      const nuevas = [];
      for(const f of files){
        try{
          const data = await comprimirImagen(f);
          nuevas.push({ name: f.name, data });
        }catch(err){ /* si una foto falla, seguimos con las demás */ }
      }
      if(!ui.suertes[idx]) ui.suertes[idx] = {};
      const existentes = ui.suertes[idx].fotos || [];
      ui.suertes[idx].fotos = existentes.concat(nuevas);
      inp.value = ''; // permite volver a elegir/tomar otra sin perder las ya cargadas
      const total = ui.suertes[idx].fotos.length;
      statusEl.innerHTML = total
        ? `${total} foto(s) lista(s) para guardar. <span class="btn-edit fotos-quitar" data-idx="${idx}" style="padding:2px 8px; font-size:0.7rem;">Quitar todas</span>`
        : 'No se pudo procesar la(s) foto(s).';
      const quitarBtn = statusEl.querySelector('.fotos-quitar');
      if(quitarBtn) quitarBtn.onclick = ()=>{
        ui.suertes[idx].fotos = [];
        statusEl.textContent = '';
      };
    };
  });
}

function comprimirImagen(file, maxWidth=1000, calidad=0.6){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', calidad));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleGuardarVisita(){
  const inpFinca = document.getElementById('inpFinca');
  if(!inpFinca.value.trim()){
    inpFinca.style.borderColor = 'var(--rust)';
    document.getElementById('fincaRequiredMsg').style.display = 'block';
    inpFinca.scrollIntoView({behavior:'smooth', block:'center'});
    inpFinca.focus();
    return;
  }
  syncSuertesFromDOM();
  syncSiguienteFromDOM();
  const requiereCartera = state.carteraComerciales.includes(ui.comercialApoyadoSel);
  const visita = {
    tecnico: ui.tecnicoSel,
    comercial: ui.comercialApoyadoSel,
    cliente: ui.clienteSel,
    fecha: document.getElementById('inpFecha').value,
    finca: document.getElementById('inpFinca').value,
    ubicacion: document.getElementById('inpUbicacion').value,
    localidad: document.getElementById('inpLocalidad').value,
    cultivo: document.getElementById('selCultivo').value,
    cultivoOtro: document.getElementById('inpCultivoOtro') ? document.getElementById('inpCultivoOtro').value : '',
    areaValor: document.getElementById('inpAreaValor').value,
    areaUnidad: document.getElementById('selAreaUnidad').value,
    persona: document.getElementById('inpPersona').value,
    actualizarContacto: document.getElementById('chkActualizarContacto').checked,
    cartera: requiereCartera ? document.getElementById('selCartera').value : '',
    carteraObs: requiereCartera ? document.getElementById('inpCarteraObs').value : '',
    suertes: ui.suertes,
    llantas: {
      obs: document.getElementById('llantasObs').value,
      urgencia: (document.querySelector('.llantas-urgencia:checked')||{}).value || '',
    },
    siguientes: ui.siguienteLaborList,
    observacionesGenerales: document.getElementById('obsGenerales').value,
  };

  const statusEl = document.getElementById('saveStatus');
  statusEl.innerHTML = `<div class="status-bar status-pending">Guardando...</div>`;

  const result = await saveVisita(visita);
  if(result.ok){
    statusEl.innerHTML = `<div class="status-bar status-ok">✓ Visita guardada y sincronizada</div>`;
    ui.tecnicoSel = ui.tecnicoSel; // keep técnico
    ui.comercialApoyadoSel=''; ui.clienteSel=''; ui.suertes=[{}]; ui.llantas=null; ui.siguienteLaborList=[{}];
    setTimeout(render, 900);
  }else{
    statusEl.innerHTML = `<div class="status-bar status-pending">📥 Sin conexión ahora mismo — esta visita quedó guardada en tu celular y se enviará sola en cuanto recuperes señal (no necesitas volver a llenarla). Puedes seguir usando la app normalmente.</div>`;
    ui.tecnicoSel = ui.tecnicoSel;
    ui.comercialApoyadoSel=''; ui.clienteSel=''; ui.suertes=[{}]; ui.llantas=null; ui.siguienteLaborList=[{}];
    setTimeout(render, 2500);
  }
}

function renderComercial(main){
  const comOptions = COMERCIALES.map(c=>`<option value="${c}" ${ui.comercialViewSel===c?'selected':''}>${c}</option>`).join('');
  let html = `
  <div class="card">
    <label class="first">Selecciona tu nombre (comercial)</label>
    <select id="selComercialView">
      <option value="">Selecciona</option>
      ${comOptions}
    </select>
  </div>`;

  if(ui.comercialViewSel){
    const visitas = Object.values(state.visitasCache)
      .filter(v=>v.comercial===ui.comercialViewSel)
      .sort((a,b)=>{
        const uMaxA = Math.min(...(a.suertes||[{urgencia:'verde'}]).map(s=>URG_ORDER[s.urgencia] ?? 3));
        const uMaxB = Math.min(...(b.suertes||[{urgencia:'verde'}]).map(s=>URG_ORDER[s.urgencia] ?? 3));
        if(uMaxA!==uMaxB) return uMaxA-uMaxB;
        return (b.fecha||'').localeCompare(a.fecha||'');
      });

    html += `<h3>Visitas recibidas (${visitas.length})</h3>`;
    if(visitas.length===0){
      html += `<div class="empty">Aún no hay visitas registradas para tus clientes.</div>`;
    }else{
      html += visitas.map(v=>renderVisitCard(v)).join('');
    }
  }

  main.innerHTML = html;
  const sel = document.getElementById('selComercialView');
  if(sel) sel.onchange = e=>{
    const nuevo = e.target.value;
    if(!verificarClave('com', nuevo, state.comercialPasswords[nuevo])){
      sel.value = ui.comercialViewSel || '';
      return;
    }
    ui.comercialViewSel = nuevo;
    render();
  };
  wireVisitDetailToggles();
}

/* ============ TAB: JEFE COMERCIAL ============ */
function renderJefe(main){
  if(!verificarClave('jefe', 'Jefe Comercial', state.jefePassword)){
    ui.activeTab = 'tecnico';
    render();
    return;
  }
  const allTecnicos = [...new Set(Object.values(state.visitasCache).map(v=>v.tecnico))];
  let visitas = Object.values(state.visitasCache);

  const f = ui.jefeFiltros;
  if(f.comercial) visitas = visitas.filter(v=>v.comercial===f.comercial);
  if(f.tecnico) visitas = visitas.filter(v=>v.tecnico===f.tecnico);
  if(f.urgencia) visitas = visitas.filter(v=>(v.suertes||[]).some(s=>s.urgencia===f.urgencia));
  if(f.tiempo) visitas = visitas.filter(v=>(v.siguientes||[]).some(s=>s.tiempo===f.tiempo));

  visitas.sort((a,b)=>{
    const uMaxA = Math.min(...(a.suertes||[{urgencia:'verde'}]).map(s=>URG_ORDER[s.urgencia] ?? 3));
    const uMaxB = Math.min(...(b.suertes||[{urgencia:'verde'}]).map(s=>URG_ORDER[s.urgencia] ?? 3));
    if(uMaxA!==uMaxB) return uMaxA-uMaxB;
    return (b.fecha||'').localeCompare(a.fecha||'');
  });

  let html = `
  <div class="filter-row">
    <select id="filtroComercial">
      <option value="">Todos los comerciales</option>
      ${COMERCIALES.map(c=>`<option ${f.comercial===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <select id="filtroTecnico">
      <option value="">Todos los técnicos</option>
      ${allTecnicos.map(t=>`<option ${f.tecnico===t?'selected':''}>${t}</option>`).join('')}
    </select>
    <select id="filtroUrgencia">
      <option value="">Toda urgencia</option>
      ${URGENCIAS.map(u=>`<option value="${u.v}" ${f.urgencia===u.v?'selected':''}>${u.label}</option>`).join('')}
    </select>
    <select id="filtroTiempo" style="border-color:var(--azul);">
      <option value="">Todo tiempo estimado</option>
      ${TIEMPOS_SIGUIENTE.map(t=>`<option value="${t.v}" ${f.tiempo===t.v?'selected':''}>${t.label}</option>`).join('')}
    </select>
  </div>
  <h3>Total visitas: ${visitas.length}</h3>
  `;

  if(visitas.length===0){
    html += `<div class="empty">No hay visitas que coincidan con estos filtros.</div>`;
  }else{
    html += visitas.map(v=>renderVisitCard(v, true)).join('');
  }

  main.innerHTML = html;
  document.getElementById('filtroComercial').onchange = e=>{ ui.jefeFiltros.comercial=e.target.value; render(); };
  document.getElementById('filtroTecnico').onchange = e=>{ ui.jefeFiltros.tecnico=e.target.value; render(); };
  document.getElementById('filtroUrgencia').onchange = e=>{ ui.jefeFiltros.urgencia=e.target.value; render(); };
  document.getElementById('filtroTiempo').onchange = e=>{ ui.jefeFiltros.tiempo=e.target.value; render(); };
  wireVisitDetailToggles();
}

function renderVisitCard(v, showComercial){

  return `

    <h3>${v.cliente}</h3>
    <div class="meta">${v.finca || 'Finca no especificada'} · ${v.fecha} ${showComercial ? '· Comercial: '+v.comercial : ''} · Técnico: ${v.tecnico}</div>
    ${urgBadge(topUrg)}
    <span class="detail-toggle" data-id="${v.id}" style="margin-left:10px;">Ver detalle</span>
    <div class="detail-body" id="detail-${v.id}" style="display:none; margin-top:10px;">
      <hr class="divider">
      <p><strong>Finca:</strong> ${v.finca||'—'} ${v.ubicacion?'· <strong>Ubicación:</strong> '+v.ubicacion:''}</p>
      <p><strong>Localidad:</strong> ${v.localidad||'—'}</p>
      <p><strong>Cultivo:</strong> ${v.cultivo==='Otro'?v.cultivoOtro:v.cultivo} · <strong>Área neta:</strong> ${v.areaValor||'—'} ${v.areaUnidad||''}</p>
      <p><strong>Persona contactada:</strong> ${v.persona||'—'}</p>
      ${v.cartera ? `<p><strong>Cartera:</strong> ${v.cartera} ${v.carteraObs?'— '+v.carteraObs:''}</p>` : ''}
      ${(v.suertes||[]).map((s,i)=>`
        <div class="suerte-block">
          <span class="tag">Suerte ${i+1}</span>
          <p><strong>STE:</strong> ${s.ste||'—'} · <strong>Área:</strong> ${s.area||'—'} ${s.areaUnidad||''} · <strong>Corte:</strong> ${s.fechaCorte||'—'}</p>
          <p><strong>Estado:</strong> ${s.estado||'—'} · <strong>Labor:</strong> ${s.labor==='Otro'?s.laborOtro:s.labor||'—'}</p>
          <p>${urgBadge(s.urgencia)}</p>
          <p><strong>Recomendación:</strong> ${s.recomendacion||'—'}</p>
          ${s.observaciones ? `<p><strong>Observaciones:</strong> ${s.observaciones}</p>`:''}
          ${s.fotos && s.fotos.length ? `<p><strong>Fotos:</strong> ${s.fotos.map((u,fi)=>`<a href="${u}" target="_blank" rel="noopener">Ver foto ${fi+1}</a>`).join(' · ')}</p>`:''}
        </div>
      `).join('')}
      ${v.llantas && (v.llantas.obs || v.llantas.urgencia) ? `
        <div class="suerte-block">
          <span class="tag">Llantas</span>
          <p>${v.llantas.obs || '—'}</p>
          <p>${urgBadge(v.llantas.urgencia)}</p>

        <p style="margin-top:10px;"><strong>Siguiente labor:</strong> ${s.labor||'—'} en STE ${s.ste||'—'} (${s.area||'—'} ${s.areaUnidad||''}) ${s.tiempo ? '— '+tiempoBadge(s.tiempo) : ''}</p>
      `).join('')}
      ${v.observacionesGenerales ? `<p><strong>Observaciones generales:</strong> ${v.observacionesGenerales}</p>` : ''}
    </div>
  </div>
  `;
}

        <input type="text" class="com-password-input" data-com="${c}" value="${state.comercialPasswords[c]||''}" placeholder="Vacío = sin contraseña" style="flex:1;">
      </div>
    `).join('')}

    <label>Contraseñas por técnico</label>
    ${state.tecnicos.map(t=>`
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
        <span style="flex:1; font-size:0.82rem;">${t}</span>
        <input type="text" class="tec-password-input" data-tec="${t}" value="${state.tecnicoPasswords[t]||''}" placeholder="Vacío = sin contraseña" style="flex:1;">
      </div>
    `).join('')}

    <button class="btn small" id="btnGuardarPasswords" style="margin-top:8px;">Guardar contraseñas</button>
    <p class="small-muted" id="passwordsGuardadoMsg" style="display:none; color:var(--moss); font-weight:600;">✓ Guardado.</p>
  </div>
  `;

  const btnReintentarCola = document.getElementById('btnReintentarCola');
  if(btnReintentarCola) btnReintentarCola.onclick = async ()=>{
    btnReintentarCola.textContent = 'Enviando...';
    await intentarVaciarCola();
    render();
  };
  const btnVaciarCola = document.getElementById('btnVaciarCola');
  if(btnVaciarCola) btnVaciarCola.onclick = ()=>{
    if(confirm('¿Seguro? Estas visitas NO se van a enviar ni guardar en ningún lado.')){
      guardarCola([]);
      render();
    }
  };

  document.getElementById('btnAddTecnico').onclick = async ()=>{
    const inp = document.getElementById('nuevoTecnico');
    const name = inp.value.trim();
    if(!name) return;
    if(!state.tecnicos.includes(name)) state.tecnicos.push(name);
    await saveConfig();
    render();
  };
  document.querySelectorAll('.x-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      state.tecnicos = state.tecnicos.filter(t=>t!==btn.dataset.t);
      delete state.principal[btn.dataset.t];
      await saveConfig();
      render();
    };
  });
  document.querySelectorAll('.principal-select').forEach(sel=>{
    sel.onchange = async ()=>{
      const tec = sel.dataset.tec;
      if(sel.value) state.principal[tec] = sel.value;
      else delete state.principal[tec];
      await saveConfig();
    };
  });
  document.querySelectorAll('.cartera-check').forEach(chk=>{
    chk.onchange = async ()=>{
      const com = chk.dataset.com;
      if(chk.checked){
        if(!state.carteraComerciales.includes(com)) state.carteraComerciales.push(com);
      }else{
        state.carteraComerciales = state.carteraComerciales.filter(c=>c!==com);
      }
      await saveConfig();
    };
  });

  document.getElementById('btnGuardarPasswords').onclick = async ()=>{
    state.adminPassword = document.getElementById('adminPasswordInput').value.trim();
    state.jefePassword = document.getElementById('jefePasswordInput').value.trim();
    document.querySelectorAll('.com-password-input').forEach(inp=>{
      state.comercialPasswords[inp.dataset.com] = inp.value.trim();
    });
    document.querySelectorAll('.tec-password-input').forEach(inp=>{
      state.tecnicoPasswords[inp.dataset.tec] = inp.value.trim();
    });
    await savePasswords();
    document.getElementById('passwordsGuardadoMsg').style.display = 'block';
  };
}

/* ============ INIT ============ */
async function init(){
  document.getElementById('main').innerHTML = `<div class="empty">Cargando...</div>`;
  await loadConfig();
  await loadAllVisitas();
  await intentarVaciarCola();
  render();
}
init();

window.addEventListener('online', async ()=>{
  const resultado = await intentarVaciarCola();
  if(resultado && resultado.enviadas > 0) render();
});

/** Cada vez que la persona vuelve a esta pestaña (la retoma después de tenerla en
 *  segundo plano), se revisa si la seguridad cambió mientras tanto — así una pestaña
 *  dejada abierta también queda protegida, no solo las que se abren de nuevo. */
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState !== 'visible') return;
  const configActual = await apiGetAllConfig();
  const versionActual = configActual['security_version'] || '';
  const versionVista = sessionStorage.getItem('security_version_seen');
  if(versionVista !== null && versionVista !== versionActual){
    Object.keys(sessionStorage).filter(k=>k.startsWith('auth_')).forEach(k=>sessionStorage.removeItem(k));
    sessionStorage.setItem('security_version_seen', versionActual);
    state.securityVersion = versionActual;
    state.tecnicoPasswords = configActual['tecnico_passwords'] ? JSON.parse(configActual['tecnico_passwords']) : {};
    state.comercialPasswords = configActual['comercial_passwords'] ? JSON.parse(configActual['comercial_passwords']) : {};
    state.jefePassword = configActual['jefe_password'] || '';
    state.adminPassword = configActual['admin_password'] || '';
    if(['jefe','comercial','config'].includes(ui.activeTab)) ui.activeTab = 'tecnico';
    render();
  }
});
</script>
